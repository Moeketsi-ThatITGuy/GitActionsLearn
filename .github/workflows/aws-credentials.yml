name: aws-credntials-checl
on: 
  push:
    branches:
      - main
permissions:
  id-token: write
  contents: read

jobs:
  getCredentials:
    runs-on: ubuntu-latest
    steps:
    - name: Read repo
      uses: actions/checkout@v4
    - name: aws getCredentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ARN }}
        aws-region: us-east-1
        mask-aws-account-id: true
    - name: Check identity
      run: aws sts get-caller-identity > /dev/null && echo "Role assumed successfully"
